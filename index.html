<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity</title>

    <div class="question" id="1">
      <div class="left-container">
        <div class="l-container-header">
          <h4>Patient Information</h4>
        </div>

        <div class="l-container-btns">
          <button
            class="case-info-btn active"
            onclick="changeInfoSection('nurseNotes', event)"
          >
            Nurse's Notes
          </button>

          <button
            class="case-info-btn"
            onclick="changeInfoSection('vitalSigns', event)"
          >
            Vital Signs
          </button>

          <button
            class="case-info-btn"
            onclick="changeInfoSection('assessment', event)"
          >
            Assessment
          </button>
        </div>
        <div class="l-container-body">
          <div class="l-container-body-header">
            <h4>Nurse's Notes</h4>
          </div>

          <div class="l-container-body-content">
            72-year-old client admitted with productive cough, fever, fatigue,
            and increasing shortness of breath. Thick yellow sputum observed.
            Chest X-ray pending.
          </div>
        </div>
      </div>

      <div class="right-container" id="0">
        <div class="r-container-header">
          <h4>Question 1</h4>
        </div>

        <div class="r-container-body">
          <p class="question-text">
            Which assessment finding requires immediate nursing intervention?
          </p>

          <div class="question-options">
            <label>
              <input type="radio" name="question-options" id="option1" />
              Temperature 38.8°C (101.8°F)
            </label>

            <label>
              <input type="radio" name="question-options" id="option2" />
              Thick yellow sputum
            </label>

            <label>
              <input type="radio" name="question-options" id="option3" />
              Oxygen saturation 89% on room air
            </label>

            <label>
              <input type="radio" name="question-options" id="option4" />
              Fatigue
            </label>
          </div>

          <div class="feedback"></div>

          <button class="submit-btn" onClick="checkAnswer()">
            Submit Answer
          </button>
          <button
            class="next-btn"
            style="display: none"
            onClick="changeQuestion()"
          >
            Next
          </button>

          <button class="score-btn" style="display: none" onClick="showScore()">
            Show Score
          </button>
        </div>
      </div>
    </div>

      /*

      // DON'T ALTER THE REST OF THE FILE // DON'T ALTER THE REST OF THE FILE // DON'T ALTER THE REST OF THE FILE
      /*
    ACTIVITY STATE:
    These values change as the learner moves through the activity. 
  */
      const activityState = {
        currentQuestionId: 1,
        score: 0,
        highlightedResponses: [],
      };

      // DON'T ALTER
      // Gets the current question name from questionOrder. DON'T EDIT
      function getCurrentQuestionName() {
        return questionOrder[activityState.currentQuestionId];
      }

      // Gets the current question object from questionBank. DON'T EDIT
      function getCurrentQuestion() {
        return questionBank[getCurrentQuestionName()];
      }

      // DON'T ALTER
      // Gets the current question's tab object from questionInfoTabs. DON'T EDIT
      function getCurrentQuestionTabs() {
        return questionInfoTabs[getCurrentQuestionName()];
      }

      // DON'T ALTER
      // Gets the total number of questions in the activity. DON'T EDIT
      function getTotalQuestions() {
        return Object.keys(questionOrder).length;
      }

      // DON'T ALTER
      // Checks whether the current question is the last question. DON'T EDIT
      function isLastQuestion() {
        return activityState.currentQuestionId === getTotalQuestions();
      }

      // DON'T ALTER
      // Adds one point to the score. DON'T EDIT
      function incrementScore() {
        activityState.score += 1;
      }

      // DON'T ALTER
      // Resets the feedback box before rendering or checking a response.
      function resetFeedback() {
        const feedbackDiv = document.querySelector(".feedback");

        feedbackDiv.className = "feedback";
        feedbackDiv.textContent = "";
        feedbackDiv.removeAttribute("style");
      }

      // DON'T ALTER
      // Shows either correct or incorrect feedback.
      function showFeedback(type, message) {
        const feedbackDiv = document.querySelector(".feedback");

        feedbackDiv.className = "feedback";
        feedbackDiv.classList.add(type);
        feedbackDiv.innerHTML = message;
      }

      // DON'T ALTER
      // Disables the submit button after a valid submission and shows the next button.
      function lockSubmitAndShowNext() {
        const submitBtn = document.querySelector(".submit-btn");
        const nextBtn = document.querySelector(".next-btn");

        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.6";
        submitBtn.style.cursor = "not-allowed";

        if (isLastQuestion()) {
          nextBtn.textContent = "View Score";
          nextBtn.onclick = showScore;
        } else {
          nextBtn.textContent = "Next";
          nextBtn.onclick = changeQuestion;
        }

        nextBtn.style.display = "inline-block";
      }

      // DON'T ALTER
      // Renders the three info tabs for the current question.
      function renderInfoTabs() {
        const tabs = getCurrentQuestionTabs();
        const tabsContainer = document.querySelector(".l-container-btns");

        const tabKeys = Object.keys(tabs);

        tabsContainer.innerHTML = tabKeys
          .map(
            (tabKey, index) => `
          <button
            class="case-info-btn ${index === 0 ? "active" : ""}"
            onclick="changeInfoSection('${tabKey}', event)"
          >
            ${tabs[tabKey].label}
          </button>
        `,
          )
          .join("");

        const firstTab = tabs[tabKeys[0]];

        document.querySelector(".l-container-body-header h4").textContent =
          firstTab.header;

        document.querySelector(".l-container-body-content").innerHTML =
          firstTab.content;
      }

      // DON'T ALTER
      // Changes the visible info tab for the current question.
      function changeInfoSection(tabId, event) {
        const tabs = getCurrentQuestionTabs();
        const selectedTab = tabs[tabId];

        if (!selectedTab) return;

        document.querySelectorAll(".case-info-btn").forEach((btn) => {
          btn.classList.remove("active");
        });

        event.currentTarget.classList.add("active");

        document.querySelector(".l-container-body-header h4").textContent =
          selectedTab.header;

        document.querySelector(".l-container-body-content").innerHTML =
          selectedTab.content;
      }

      // DON'T ALTER
      // Renders the full current question.
      function renderQuestion() {
        const question = getCurrentQuestion();

        document.querySelector(".question").id =
          activityState.currentQuestionId;

        document.querySelector(".r-container-header h4").textContent =
          `Question ${activityState.currentQuestionId}`;

        document.querySelector(".question-text").innerHTML = question.question;

        renderInfoTabs();
        renderOptions(question);
        resetFeedback();

        const submitBtn = document.querySelector(".submit-btn");
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        submitBtn.style.cursor = "pointer";

        const nextBtn = document.querySelector(".next-btn");
        nextBtn.style.display = "none";
        nextBtn.textContent = "Next";
        nextBtn.onclick = changeQuestion;

        activityState.highlightedResponses = [];
      }

      // DON'T ALTER
      // Sends the current question to the correct option-rendering function.
      function renderOptions(question) {
        const optionsContainer = document.querySelector(".question-options");

        if (question.type === "mcq-single-response") {
          renderSingleResponseOptions(question, optionsContainer);
        } else if (question.type === "mcq-matrix-single-response") {
          renderMatrixOptions(question, optionsContainer);
        } else if (question.type === "select-all-that-apply") {
          renderSelectAllOptions(question, optionsContainer);
        } else if (question.type === "drop-down-cloze") {
          renderDropDownClozeOptions(question, optionsContainer);
        } else if (question.type === "drag-drop-cloze") {
          renderDragDropClozeOptions(question, optionsContainer);
        } else if (question.type === "highlight-in-table") {
          renderHighlightTableOptions(question, optionsContainer);
        }
      }

      // DON'T ALTER
      // Renders single-response MCQ options.
      function renderSingleResponseOptions(question, optionsContainer) {
        optionsContainer.innerHTML = question.options
          .map(
            (option) => `
          <label>
            <input
              type="radio"
              name="question-options"
              id="${option.id}"
            />
            ${option.text}
          </label>
        `,
          )
          .join("");
      }

      // DON'T ALTER
      // Renders matrix-style MCQ options.

      // DON'T ALTER

      function checkSingleResponseAnswer(question) {
        const selectedOption = document.querySelector(
          'input[name="question-options"]:checked',
        );

        if (!selectedOption) {
          showFeedback(
            "incorrect",
            "Please select an answer before submitting.",
          );
          return;
        }

        if (selectedOption.id === question.correctAnswerId) {
          incrementScore();
          showFeedback("correct", question.correctFeedback);
        } else {
          showFeedback("incorrect", question.incorrectFeedback);
        }

        lockSubmitAndShowNext();
      }

      // DON'T ALTER
      // Checks the matrix-style MCQ answer.
      function checkMatrixAnswer(question) {
        const incorrectAnswers = {};
        let allAnswered = true;
        let allCorrect = true;

        question.options.forEach((option, index) => {
          const selectedOption = document.querySelector(
            `input[name="${option.id}"]:checked`,
          );

          if (!selectedOption) {
            allAnswered = false;
            return;
          }

          const correctAnswer = question.correctAnswers[option.id];

          if (selectedOption.value !== correctAnswer) {
            allCorrect = false;

            incorrectAnswers[index + 1] = {
              selected: selectedOption.value,
              correct: correctAnswer,
            };
          }
        });

        if (!allAnswered) {
          showFeedback(
            "incorrect",
            "Please answer all statements before submitting.",
          );
          return;
        }

        if (allCorrect) {
          incrementScore();
          showFeedback("correct", question.correctFeedback);
        } else {
          const labelMap = {
            understanding: "Understanding",
            noUnderstanding: "No Understanding",
          };

          showFeedback(
            "incorrect",
            `
          <strong>Some responses are incorrect.</strong><br>
          Review the statements below.
          <br><br>

          <strong>Incorrect Responses:</strong>
          <ul style="margin-top:10px; padding-left:20px;">
            ${Object.entries(incorrectAnswers)
              .map(
                ([questionNumber, { selected, correct }]) => `
                  <li style="margin-bottom:10px;">
                    <strong>Statement ${questionNumber}</strong><br>
                    Your answer: ${labelMap[selected]}<br>
                    Correct answer: ${labelMap[correct]}<br>
                    <strong>Reason: ${question.options[questionNumber - 1].reasonForIncorrect}</strong>
                  </li>
                `,
              )
              .join("")}
          </ul>
        `,
          );
        }

        lockSubmitAndShowNext();
      }

      function checkDropDownClozeAnswer(question) {

        const blank1Text = blank1.textContent.trim();
        const blank2Text = blank2.textContent.trim();

        const correctBlank1 = question.correctAnswers.blank1;
        const correctBlank2 = question.correctAnswers.blank2;

        if (blank1Text === correctBlank1 && blank2Text === correctBlank2) {
          incrementScore();
          showFeedback("correct", question.correctFeedback);
        } else {
          blank1.textContent = correctBlank1;

      // DON'T ALTER

      function checkDragDropClozeAnswer(question) {
        const blank1 = document.getElementById("blank1");
        const blank2 = document.getElementById("blank2");

        const userAnswers = [
          blank1.textContent.trim(),
          blank2.textContent.trim(),
        ];

        const allCorrect = arraysMatchExactly(
          userAnswers,
          question.correctAnswers,
        );

        if (allCorrect) {
          incrementScore();
          showFeedback("correct", question.correctFeedback);
        } else {
          blank1.textContent = question.correctAnswers[0];
          blank1.style.color = "#2ecc71";

      // DON'T ALTER
      // Compares two arrays and confirms they contain the same values.
      function arraysMatchExactly(userAnswers, correctAnswers) {
        if (userAnswers.length !== correctAnswers.length) return false;

        const sortedUserAnswers = [...userAnswers].sort();
        const sortedCorrectAnswers = [...correctAnswers].sort();

        return sortedUserAnswers.every(
          (answer, index) => answer === sortedCorrectAnswers[index],
        );
      }
