<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activity</title>
  </head>
  <body>
    <div class="question" id="1">
      <div class="left-container">
        <div class="l-container-header">
          <h4>Patient Information</h4>
        </div>

        <div class="l-container-btns">
          <button
            class="case-info-btn active"
            onclick="changeInfoSection('nurseNotes', event)"
          >
            Nurse's Notes
          </button>

          <button
            class="case-info-btn"
            onclick="changeInfoSection('vitalSigns', event)"
          >
            Vital Signs
          </button>

          <button
            class="case-info-btn"
            onclick="changeInfoSection('assessment', event)"
          >
            Assessment
          </button>
        </div>
        <div class="l-container-body">
          <div class="l-container-body-header">
            <h4>Nurse's Notes</h4>
          </div>

          <div class="l-container-body-content">
            72-year-old client admitted with productive cough, fever, fatigue,
            and increasing shortness of breath. Thick yellow sputum observed.
            Chest X-ray pending.
          </div>
        </div>
      </div>

      <div class="right-container">
        <div class="r-container-header">
          <h4>Question 1</h4>
        </div>

        <div class="r-container-body">
          <p class="question-text">
            Which assessment finding requires immediate nursing intervention?
          </p>

          <div class="question-options">
            <label>
              <input type="radio" name="question-options" id="option1" />
              Temperature 38.8°C (101.8°F)
            </label>

            <label>
              <input type="radio" name="question-options" id="option2" />
              Thick yellow sputum
            </label>

            <label>
              <input type="radio" name="question-options" id="option3" />
              Oxygen saturation 89% on room air
            </label>

            <label>
              <input type="radio" name="question-options" id="option4" />
              Fatigue
            </label>
          </div>

          <div class="feedback"></div>

          <button class="submit-btn" onClick="checkAnswer()">
            Submit Answer
          </button>
          <button
            class="next-btn"
            style="display: none"
            onClick="changeQuestion()"
          >
            Next
          </button>
        </div>
      </div>
    </div>

    <script>
      const changeInfoSection = (tabId, event) => {
        document.querySelectorAll(".case-info-btn").forEach((btn) => {
          btn.classList.remove("active");
        });

        event.currentTarget.classList.add("active");
        const tabsInfo = {
          nurseNotes: {
            header: "Nurse's Notes",
            content:
              "72-year-old client admitted with productive cough, fever, fatigue, and increasing shortness of breath. Thick yellow sputum observed. Chest X-ray pending.",
          },
          vitalSigns: {
            header: "Vital Signs",
            content: `
                <ul>
                    <li><strong>Temperature:</strong> 38.8°C (101.8°F)</li>
                    <li><strong>Heart Rate:</strong> 102 bpm</li>
                    <li><strong>Blood Pressure:</strong> 130/85 mmHg</li>
                    <li><strong>Respiratory Rate:</strong> 24 breaths/min</li>
                    <li><strong>Oxygen Saturation:</strong> 89% on room air</li>
                </ul>
            `,
          },
          assessment: {
            header: "Assessment",
            content:
              "Client is experiencing difficulty breathing and has a productive cough with thick yellow sputum. Auscultation reveals crackles in the lower lung fields.",
          },
        };
        if (tabsInfo[tabId]) {
          const { header, content } = tabsInfo[tabId];
          document.querySelector(".l-container-body-header h4").textContent =
            header;
          document.querySelector(".l-container-body-content").innerHTML =
            content;
        }
      };

      // This functions changes questions and options when the user clicks NEXT.
      // It also resets the feedback and hides the NEXT button until the user submits an answer.
      // It gets triggered when pressing NEXT.

      const changeQuestion = () => {
        console.log("clicked");

        const questionTypes = {
          1: {
            question:
              "Which assessment finding requires immediate nursing intervention?",
            options: [
              { id: "option1", text: "Temperature 38.8°C (101.8°F)" },
              { id: "option2", text: "Thick yellow sputum" },
              { id: "option3", text: "Oxygen saturation 89% on room air" },
              { id: "option4", text: "Fatigue" },
            ],
            correctAnswerId: "option3",
          },

          2: {
            question:
              "For each client statement, click or specify (with an X) whether the statement indicates <b>understanding</b> or <b>no understanding</b> of the teaching provided.",
            options: [
              {
                id: "scenario1",
                text: "I'll call my surgeon if my incision gets red or has drainage.",
              },
              {
                id: "scenario2",
                text: "I can stop taking my blood thinner when I get home.",
              },
              {
                id: "scenario3",
                text: "I'll have physical therapy for about a week.",
              },
              {
                id: "scenario4",
                text: "I'm allowed to bear weight on my right leg.",
              },
              {
                id: "scenario5",
                text: "I can probably drive in a few months.",
              },
            ],
          },

          3: {
            question:
              "The nurse reviews the client assessment findings and determines that the client most likely has which of the following conditions? <b>Select all that apply.</b>",
            options: [
              { id: "option1", text: "Urosepsis" },
              { id: "option2", text: "Delirium" },
              { id: "option3", text: "Dehydration" },
              { id: "option4", text: "COVID-19" },
              { id: "option5", text: "DKA" },
              { id: "option6", text: "Transient ischemic attack" },
              { id: "option7", text: "Hyperglycemic hyperosmolar syndrome" },
            ],
          },

          4: {
            question: `
        Based on the client's assessment findings, complete the following sentence by choosing from the lists of options provided.
        <br><br>

        The nurse reviews the client's assessment data and recognizes that she most likely has
        <span class="drop-down-cloze-answer" id="blank1">______</span>.
        The priority for this client's care is to
        <span class="drop-down-cloze-answer" id="blank2">______</span>.
      `,

            options: {
              blank1: [
                { id: "option1", text: "CKD" },
                { id: "option2", text: "Gestational diabetes" },
                { id: "option3", text: "Preeclampsia" },
                { id: "option4", text: "HELLP syndrome" },
              ],

              blank2: [
                { id: "option5", text: "Admit the client to the hospital" },
                { id: "option6", text: "Ensure maternal and fetal safety" },
                { id: "option7", text: "Restrict her fluid intake" },
                { id: "option8", text: "Place her on a special diet" },
              ],
            },
          },
        };

        const givenInfoTypes = {
          1: {
            showButtons: true,
            header: "Nurse's Notes",
            content:
              "72-year-old client admitted with productive cough, fever, fatigue, and increasing shortness of breath. Thick yellow sputum observed. Chest X-ray pending.",
          },

          2: {
            showButtons: false,
            header: "Client Information",
            content:
              "The nurse provides health teaching for a 70-year-old client who had a TKA 3 days ago and is preparing to go home with a daughter.",
          },

          3: {
            showButtons: false,
            header: "Client Information",
            content: `
        An 81-year-old client was admitted to an acute care unit from an assisted-living facility with a low-grade fever and acute confusion.
        The client's daughter tells the admitting nurse that the client's mother had a stroke 2 years ago that resulted in left hemiparesis
        and urinary incontinence, and the client has been in the assisted-living facility for the past 5 months.
        The client has a long history of DM type 2, which has been well controlled. Until this morning,
        the client's daughter had not been allowed to visit the facility due to the COVID-19 pandemic.
        During the visit today, the daughter noted that her mother was lethargic, confused, and unable to ambulate with a walker.
        POC testing in the ED indicated the presence of multiple bacteria in the client's urine and FSBG of 331 mg/dL (18.4 mmol/L).
        The client's BP is currently 96/48 mm Hg.
      `,
          },

          4: {
            showButtons: false,
            header: "Client Information",
            content: `
        <p>
          A woman who is 32 weeks pregnant visits her primary health care provider for the monthly OB visit. The nurse performs an initial assessment of the client prior to being examined by the provider and collects the following client data:
        </p>

        <ul>
          <li>States that she has had several mild to moderate headaches during the past week</li>
          <li>Gained 10 lb since last visit 4 weeks ago</li>
          <li>States that the baby is very active, especially at night</li>
          <li>FHR = 146 BPM</li>
          <li>Temperature = 98°F (36.7°C)</li>
          <li>HR = 82 BPM and regular</li>
          <li>RR = 18 bpm</li>
          <li>BP = 150/92 mm Hg</li>
          <li>Urine protein = 1+</li>
          <li>1+ pitting edema on both feet and ankles</li>
        </ul>
      `,
          },
        };

        const questionDiv = document.querySelector(".question");
        const currentQuestionId = parseInt(questionDiv.id);
        const nextQuestionId = currentQuestionId + 1;

        if (nextQuestionId > Object.keys(questionTypes).length) {
          document.querySelector(".next-btn").style.display = "none";
          return;
        }

        questionDiv.id = nextQuestionId;

        const newQuestion = questionTypes[nextQuestionId];
        const givenInfo = givenInfoTypes[nextQuestionId];

        document.querySelector(".l-container-body-header h4").textContent =
          givenInfo.header;

        document.querySelector(".l-container-body-content").innerHTML =
          givenInfo.content;

        document.querySelector(".l-container-btns").style.display =
          givenInfo.showButtons ? "flex" : "none";

        document.querySelector(".r-container-header h4").textContent =
          `Question ${nextQuestionId}`;

        document.querySelector(".question-text").innerHTML =
          newQuestion.question;

        const optionsContainer = document.querySelector(".question-options");

        const feedbackDiv = document.querySelector(".feedback");
        feedbackDiv.className = "feedback";
        feedbackDiv.textContent = "";
        feedbackDiv.style.display = "none";

        document.querySelector(".next-btn").style.display = "none";

        if (nextQuestionId === 2) {
          optionsContainer.innerHTML = `
      <table class="question-table">
        <thead>
          <tr>
            <th>Client Statement</th>
            <th>Understanding</th>
            <th>No Understanding</th>
          </tr>
        </thead>

        <tbody>
          ${newQuestion.options
            .map(
              (option) => `
                <tr>
                  <td>${option.text}</td>

                  <td>
                    <input
                      type="radio"
                      name="${option.id}"
                      id="${option.id}-understanding"
                      value="understanding">
                  </td>

                  <td>
                    <input
                      type="radio"
                      name="${option.id}"
                      id="${option.id}-noUnderstanding"
                      value="noUnderstanding">
                  </td>
                </tr>
              `,
            )
            .join("")}
        </tbody>
      </table>
    `;
        } else if (nextQuestionId === 3) {
          optionsContainer.innerHTML = `
      ${newQuestion.options
        .map(
          (option) => `
            <label>
              <input
                type="checkbox"
                name="question-options"
                id="${option.id}">
              ${option.text}
            </label>
          `,
        )
        .join("")}
    `;
        } else if (nextQuestionId === 4) {
          optionsContainer.innerHTML = `
      <div class="cloze-options-container">
        <div class="cloze-option-group">
          <h4>Options for 1</h4>

          ${newQuestion.options.blank1
            .map(
              (option) => `
                <button
                  type="button"
                  class="cloze-option-btn"
                  data-blank="blank1"
                  data-option-id="${option.id}"
                  onclick="selectClozeOption(this)">
                  ${option.text}
                </button>
              `,
            )
            .join("")}
        </div>

        <div class="cloze-option-group">
          <h4>Options for 2</h4>

          ${newQuestion.options.blank2
            .map(
              (option) => `
                <button
                  type="button"
                  class="cloze-option-btn"
                  data-blank="blank2"
                  data-option-id="${option.id}"
                  onclick="selectClozeOption(this)">
                  ${option.text}
                </button>
              `,
            )
            .join("")}
        </div>
      </div>
    `;
        }
      };

      const selectClozeOption = (button) => {
        const blankId = button.dataset.blank;
        const text = button.textContent.trim();

        // Update the corresponding blank
        const blank = document.getElementById(blankId);
        blank.textContent = text;
        blank.style.color = "#FF4500";

        // Remove selection from other buttons in the same group
        document
          .querySelectorAll(`.cloze-option-btn[data-blank="${blankId}"]`)
          .forEach((btn) => btn.classList.remove("selected"));

        // Highlight selected button
        button.classList.add("selected");
      };

      const checkAnswer = () => {
        console.log("check clicked");
        const incorrectAnswers = {};

        const questionTwoCorrectAnswer = {
          1: "understanding",
          2: "noUnderstanding",
          3: "noUnderstanding",
          4: "understanding",
          5: "understanding",
        };

        const feedbackDiv = document.querySelector(".feedback");
        const nextBtn = document.querySelector(".next-btn");

        // Reset feedback
        feedbackDiv.className = "feedback";
        feedbackDiv.textContent = "";
        feedbackDiv.removeAttribute("style");

        if (document.querySelector(".question").id === "1") {
          const selectedOption = document.querySelector(
            'input[name="question-options"]:checked',
          );

          if (!selectedOption) {
            feedbackDiv.classList.add("incorrect");
            feedbackDiv.textContent =
              "Please select an answer before submitting.";
            return;
          }

          if (selectedOption.id === "option3") {
            feedbackDiv.classList.add("correct");
            feedbackDiv.textContent =
              "Correct! Oxygen saturation below 90% is a critical finding that requires immediate intervention.";
          } else {
            feedbackDiv.classList.add("incorrect");
            feedbackDiv.textContent =
              "Incorrect. Please review the patient's vital signs and reassess.";
          }

          nextBtn.style.display = "inline-block";
        } else if (document.querySelector(".question").id === "2") {
          const selectedOptions = Array.from(
            document.querySelectorAll(".question-table input:checked"),
          );

          if (selectedOptions.length < 5) {
            feedbackDiv.classList.add("incorrect");
            feedbackDiv.textContent =
              "Please answer all statements before submitting.";
            return;
          }

          let allCorrect = true;

          selectedOptions.forEach((option, index) => {
            const questionNumber = index + 1;

            if (option.value !== questionTwoCorrectAnswer[questionNumber]) {
              allCorrect = false;
              incorrectAnswers[questionNumber] = {
                selected: option.value,
                correct: questionTwoCorrectAnswer[questionNumber],
              };
            }
          });

          if (allCorrect) {
            feedbackDiv.classList.add("correct");
            feedbackDiv.textContent =
              "All answers are correct! The client demonstrates understanding of the teaching provided.";
          } else {
            feedbackDiv.classList.add("incorrect");

            const labelMap = {
              understanding: "Understanding",
              noUnderstanding: "No Understanding",
            };

            feedbackDiv.innerHTML = `
          <strong>Some responses are incorrect.</strong><br>
          Review the statements below and try again.
          <br><br>

          <strong>Incorrect Responses:</strong>
          <ul style="margin-top:10px; padding-left:20px;">
            ${Object.entries(incorrectAnswers)
              .map(
                ([questionNumber, { selected, correct }]) => `
                  <li style="margin-bottom:10px;">
                    <strong>Statement ${questionNumber}</strong><br>
                    Your answer: ${labelMap[selected]}<br>
                    Correct answer: ${labelMap[correct]}
                  </li>
                `,
              )
              .join("")}
          </ul>
        `;
          }

          nextBtn.style.display = "inline-block";
        } else if (document.querySelector(".question").id === "3") {
          const selectedOptions = Array.from(
            document.querySelectorAll(
              '.question-options input[type="checkbox"]:checked',
            ),
          );

          const correctAnswers = ["option1", "option2", "option3", "option7"];

          const selectedIds = selectedOptions.map((option) => option.id);

          const allCorrect =
            selectedIds.length === correctAnswers.length &&
            selectedIds.every((id) => correctAnswers.includes(id));

          if (allCorrect) {
            feedbackDiv.classList.add("correct");
            feedbackDiv.textContent =
              "Correct! The client most likely has urosepsis, dehydration, and COVID-19.";
          } else {
            feedbackDiv.classList.add("incorrect");
            feedbackDiv.textContent =
              "Incorrect. The client most likely has urosepsis, delirium, dehydration, and hyperglycemia hyperosmolar syndrome.";
          }

          nextBtn.style.display = "inline-block";
        } else if (document.querySelector(".question").id === "4") {
          const blank1 = document.getElementById("blank1");
          const blank2 = document.getElementById("blank2");

          const blank1Text = blank1.textContent.trim();
          const blank2Text = blank2.textContent.trim();

          const correctBlank1 = "HELLP syndrome";
          const correctBlank2 = "Place her on a special diet";

          if (blank1Text === correctBlank1 && blank2Text === correctBlank2) {
            feedbackDiv.classList.add("correct");
            feedbackDiv.textContent =
              "Correct! The sentence has been completed correctly.";
          } else {
            // Show the correct answers in the blanks
            blank1.textContent = correctBlank1;
            blank1.style.color = "#2ecc71";

            blank2.textContent = correctBlank2;
            blank2.style.color = "#2ecc71";

            feedbackDiv.classList.add("incorrect");
            feedbackDiv.textContent =
              "Incorrect. The correct answers have been highlighted above.";
          }

          nextBtn.style.display = "inline-block";
        }
        F;
      };
    </script>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f7f7fb;
        padding: 1rem;
      }

      .question {
        display: flex;
        gap: 2rem;
        align-items: flex-start;
        max-width: 1400px;
        margin: 0 auto;
      }

      .left-container {
        width: 50%;
      }

      .right-container {
        width: 50%;
        background: #ffffff;
        padding: 2rem;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        border-radius: 8px;
        border: 1px solid #e5e5e5;
      }

      .l-container-header h4 {
        font-size: 2rem;
        margin-bottom: 1.25rem;
      }

      .l-container-btns {
        display: flex;
        gap: 0.625rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .case-info-btn {
        background: #e9ecf4;
        color: #222;
        border: none;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.95rem;
      }

      .case-info-btn.active {
        background: #ff4500;
        color: #ffffff;
      }

      .case-info-btn:hover {
        opacity: 0.9;
      }

      .l-container-body {
        background: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        min-height: 300px;
        padding: 1.5rem;
      }

      .l-container-body-header {
        margin-bottom: 1rem;
      }

      .l-container-body-header h4 {
        font-size: 1.6rem;
      }

      .l-container-body-content {
        font-size: 1.15rem;
        line-height: 1.55;
      }

      .r-container-header h4 {
        color: #ff4500;
        font-size: 2rem;
        margin-bottom: 1rem;
      }

      .question-text {
        font-size: 1.15rem;
        line-height: 1.35;
        margin-bottom: 1.5rem;
      }

      .question-options {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      .question-options label {
        border: 1px solid #e5e5e5;
        padding: 1rem;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        cursor: pointer;
        font-size: 1.1rem;
        line-height: 1.4;
        background: #ffffff;
      }

      .question-options label:hover {
        border-color: #ff4500;
      }

      .question-options input[type="radio"] {
        transform: scale(1.15);
      }

      .question-table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        font-size: 1rem;
      }

      .question-table th,
      .question-table td {
        border: 1px solid #e5e5e5;
        padding: 0.85rem;
        text-align: center;
        vertical-align: middle;
      }

      .question-table th:first-child,
      .question-table td:first-child {
        text-align: left;
      }

      .question-table th {
        background: #f7f7fb;
        font-weight: bold;
      }

      .submit-btn,
      .next-btn {
        border: none;
        padding: 0.85rem 1.75rem;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: bold;
        cursor: pointer;
        margin-right: 0.5rem;
      }

      .submit-btn {
        background: #ff4500;
        color: #ffffff;
      }

      .submit-btn:hover {
        background: #ff5c1f;
      }

      .next-btn {
        background: #000000;
        color: #ffffff;
      }

      .next-btn:hover {
        opacity: 0.65;
      }

      .feedback {
        display: none;
        margin: 1.25rem 0;
        padding: 1rem 1.25rem;
        border-radius: 6px;
        border-left: 6px solid;
        font-size: 1rem;
        line-height: 1.5;
        font-weight: 500;
      }

      .feedback.correct {
        display: block;
        background: #eefaf4;
        color: #1f7a43;
        border-color: #2ecc71;
      }

      .feedback.incorrect {
        display: block;
        background: #fff3f3;
        color: #c0392b;
        border-color: #ff4500;
      }

      .drop-down-cloze-answer {
        display: inline-block;
        min-width: 160px;
        padding: 0.15rem 0.5rem;
        margin: 0 0.25rem;
        background: #dcefff;
        color: #ff4500;
        border-bottom: 2px solid #ff4500;
        font-weight: bold;
        text-align: center;
      }

      .cloze-options-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        border-top: 3px solid #3bb3a6;
        padding-top: 0.75rem;
        margin-top: 1rem;
      }

      .cloze-option-group h4 {
        color: #142b5f;
        font-size: 1.15rem;
        margin-bottom: 0.5rem;
        padding-bottom: 0.25rem;
      }

      .cloze-option-btn {
        display: block;
        width: 100%;
        background: transparent;
        border: none;
        padding: 0.35rem 0;
        text-align: left;
        color: #333;
        font-size: 1rem;
        cursor: pointer;
      }

      .cloze-option-btn:hover {
        color: #ff4500;
        font-weight: bold;
      }

      .cloze-option-btn.selected {
        color: #ff4500;
        font-weight: bold;
        text-decoration: underline;
      }

      @media (max-width: 900px) {
        body {
          padding: 0.75rem;
        }

        .question {
          flex-direction: column;
          gap: 1rem;
        }

        .left-container,
        .right-container {
          width: 100%;
        }

        .right-container {
          padding: 1.25rem;
        }

        .l-container-header h4,
        .r-container-header h4 {
          font-size: 1.6rem;
        }

        .question-text {
          font-size: 1.25rem;
        }

        .l-container-body-content,
        .question-options label {
          font-size: 1rem;
        }

        .question-table {
          font-size: 0.95rem;
        }
      }

      @media (max-width: 600px) {
        .l-container-btns {
          flex-direction: column;
        }

        .case-info-btn,
        .submit-btn,
        .next-btn {
          width: 100%;
        }

        .question-table {
          display: block;
          overflow-x: auto;
          white-space: nowrap;
        }

        .question-table th,
        .question-table td {
          padding: 0.7rem;
        }
        .cloze-options-container {
          grid-template-columns: 1fr;
          gap: 1rem;
        }

        .drop-down-cloze-answer {
          display: block;
          margin: 0.5rem 0;
